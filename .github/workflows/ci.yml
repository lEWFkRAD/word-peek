name: Word Peek
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: word-peek-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks history scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HERMES_CHECKOUT: ${{ github.workspace }}/_hermes-loader
    defaults:
      run:
        working-directory: word-peek/dev
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: word-peek/dev/package-lock.json
      - name: Repository hygiene and working-tree secret scan
        shell: pwsh
        working-directory: .
        run: ./scripts/check.ps1
      - name: Install locked development dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify shipped bundles match source
        run: npm run check:release
      - name: Check out the tested Hermes loader
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: lEWFkRAD/hermes-agent
          ref: d8039c60228a9e71a004ed26f4588d3e0441d648
          path: _hermes-loader
          sparse-checkout-cone-mode: false
          sparse-checkout: /apps/desktop/src/contrib/runtime-loader.ts
          persist-credentials: false
      - name: Unit, browser, and actual-loader regressions
        env:
          HERMES_HOME: ${{ runner.temp }}/word-peek-test-home
        run: npm test
